[package]
name = "gitowl"
version = "0.1.1"
edition = "2024"
description = "A desktop Git and GitHub workspace launched with one command"
license = "MIT OR Apache-2.0"
# Also drives Settings → Check for updates (latest release of this repository).
repository = "https://github.com/ardfaiyaz/gitowl"
homepage = "https://github.com/ardfaiyaz/gitowl"
readme = "README.md"
# Verified: the dependency tree needs 1.88 (ICU crates); CI builds on stable.
rust-version = "1.88"
keywords = ["git", "github", "gui", "desktop", "version-control"]
categories = ["development-tools", "command-line-utilities"]
exclude = ["/work", "/docs", "/scripts", "/.github", "/frontend/node_modules"]

[package.metadata.deb]
maintainer = "gitowl maintainers"
section = "devel"
depends = "$auto, git"
assets = [
    ["target/release/gitowl", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/gitowl/", "644"],
    ["LICENSE-MIT", "usr/share/doc/gitowl/", "644"],
    ["LICENSE-APACHE", "usr/share/doc/gitowl/", "644"],
    ["packaging/linux/gitowl.desktop", "usr/share/applications/", "644"],
    ["assets/brand/png/gitowl-256.png", "usr/share/icons/hicolor/256x256/apps/gitowl.png", "644"],
    ["assets/brand/png/gitowl-512.png", "usr/share/icons/hicolor/512x512/apps/gitowl.png", "644"],
]

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
mime_guess = "2.0.5"
rand = "0.10.3"
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tao = { version = "0.37", optional = true }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "process", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wry = { version = "0.57", optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[features]
default = ["desktop"]
desktop = ["dep:tao", "dep:wry"]

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"
