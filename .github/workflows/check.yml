name: Checks
on: [push, pull_request]
# Read-only token; a newer push to the same branch cancels the older run.
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev libdbus-1-dev
      - run: npm ci --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm run build --prefix frontend
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - name: Install WebView2 Runtime for desktop testing
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $runtime = Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application\*\msedgewebview2.exe", "$env:LOCALAPPDATA\Microsoft\EdgeWebView\Application\*\msedgewebview2.exe" -ErrorAction SilentlyContinue
          if (-not $runtime) {
            $installer = Join-Path $env:RUNNER_TEMP 'WebView2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
            $result = Start-Process $installer -ArgumentList '/silent', '/install' -WindowStyle Hidden -Wait -PassThru
            if ($result.ExitCode -ne 0) { throw "WebView2 installation failed: $($result.ExitCode)" }
          }
      - name: Check native desktop startup from a protected folder
        if: runner.os == 'Windows'
        run: node scripts/desktop-smoke.mjs
      - run: node scripts/smoke.mjs
      - run: node scripts/smoke.mjs target/debug/gitowl${{ runner.os == 'Windows' && '.exe' || '' }} --outside
